name: Example Workflow

on: [push]

jobs:
  create-jira-ticket:
    runs-on: ubuntu-latest
    outputs:
      pr_title: ${{ steps.update-pr-title-with-jira-id.pr_title }}
    steps:
      - name: Set an output value
        id: set-output
        run: |
          PR_TITLE=$(cat << 'EOF'
          Upgrade blabla to blabla
          EOF
          )
          NEW_TITLE="[BEE-51275] - ${PR_TITLE}"
          echo "pr_title=$NEW_TITLE" >> $GITHUB_OUTPUT

  pr-title-updater:
    runs-on: ubuntu-latest
    needs: create-jira-ticket
    steps:
      - name: Use output from first-job
        run: |
          echo "The value passed from first-job is: ${{ needs.create-jira-ticket.outputs.pr_title }}"
