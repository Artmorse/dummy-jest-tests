name: Example Workflow

on: [push]

jobs:
  first-job:
    runs-on: ubuntu-latest
    outputs:
      myOutput: ${{ steps.set-output.outputs.myValue }}
    steps:
      - name: Set an output value
        id: set-output
        run: echo "myValue=Hello World" >> $GITHUB_OUTPUT

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Use output from first-job
        run: |
          echo "The value passed from first-job is: ${{ needs.first-job.outputs.myOutput }}"
